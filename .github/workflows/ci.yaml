name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_push_to_docker_hub:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
    - name: Chack out the repo
      uses: actions/checkout@v2
    - name: Set up Docker Buidx
      uses: docker/setup-buildx-action@v1
    - name: Login to Docker
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Push to Docker Hub
      uses: docker/build-push-action@v2
      with:
        context: ./
        file: ./Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/landing:latest
  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push_to_docker_hub
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Copy docker-compose.yml via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }} # тут у вас root
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml" # какой файл копировать из репозитория
          target: "/"
      - name: executing remote ssh commands to deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            echo "SSH connection successful"
            whoami
            hostname
            pwd
            sudo rm .env
            touch .env
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/landing:latest
            sudo docker compose stop
            sudo docker compose rm web
            echo DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }} >> .env
            echo DJANGO_DEBUG=False >> .env
            echo DJANGO_ALLOWED_HOSTS=${{ secrets.DJANGO_ALLOWED_HOSTS }} >> .env
            echo DATABASE_URL=${{ secrets.DATABASE_URL }} >> .env
            export DOCKER_USERNAME==${{ secrets.DOCKER_USERNAME }}
            # echo DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }} >> .env
            sudo docker compose up -d --build
